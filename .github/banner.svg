    <!-- code mockup: install + configure + use -->
    <rect x="130" y="148" width="540" height="158" rx="10" fill="#151c22" stroke="#2c3942"/>
    <rect x="130" y="148" width="540" height="28" rx="10" fill="#19232b"/>
